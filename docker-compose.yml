version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kics_ticketing_db
    environment:
      POSTGRES_USER: kics_user
      POSTGRES_PASSWORD: kics_password
      POSTGRES_DB: kics_ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kics_user -d kics_ticketing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kics_ticketing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: kics_ticketing_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://kics_user:kics_password@db:5432/kics_ticketing
      REDIS_URL: redis://redis:6379
      SECRET_KEY: change-this-in-production
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data: